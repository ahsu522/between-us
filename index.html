<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Little Questions">
  <meta name="description" content="50 questions, one DRAW button. A little closer, one card at a time.">
  <title>Little Questions — DRAW</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo"><span class="logo-mark" aria-hidden="true">✳</span> LITTLE QUESTIONS</div>
    <button class="reset" id="resetButton" type="button" title="重新洗牌，從頭開始">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
      RESTART
    </button>
  </header>
  <main class="experience" aria-label="隨機抽題遊戲">
    <section class="intro">
      <p class="eyebrow">A LITTLE CLOSER · ONE CARD AT A TIME</p>
      <h1>Just one<br><em>question.</em></h1>
      <p class="subtitle">抽一題 聊一點</p>
    </section>
    <section class="stage" aria-label="目前的題目卡片">
      <div class="card-shell" id="cardShell">
        <div class="card-back" id="initialCard" aria-label="準備好抽第一題">
          <span class="corner">50 CARDS</span>
          <span class="mark" aria-hidden="true">?</span>
          <h2>Ready to<br><span>get curious?</span></h2>
          <p>按下 DRAW，看看抽到哪一題 ✦</p>
        </div>
        <img id="cardImage" class="card-image" alt="" hidden decoding="async">
      </div>
      <button type="button" id="zoomBtn" class="zoom" aria-label="放大題目" title="放大題目" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
      </button>
    </section>
    <section class="controls" aria-label="抽題操作">
      <div class="progress-block">
        <div class="progress-top"><span id="statusLabel">READY TO PLAY</span><strong id="counter">0 / 50</strong></div>
        <div class="track" role="progressbar" aria-label="已抽過的題數" aria-valuemin="0" aria-valuemax="50"><div class="bar" id="progressFill"></div></div>
      </div>
      <button id="drawBtn" class="draw" type="button" aria-label="DRAW 隨機抽一張題目卡">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h2.5a6 6 0 0 0 5-2.5l5-7A6 6 0 0 1 19.5 6H22"/><path d="M2 6h2.5a6 6 0 0 1 5 2.5l1.2 1.7"/><path d="M14.2 14.6l.3.4a6 6 0 0 0 5 2.5H22"/></svg>
        <span id="drawLabel">DRAW</span>
        <svg class="next-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
      </button>
      <div class="hint" id="hint" aria-live="polite">每次隨機抽一題 · 50 題全部抽完前不重複</div>
    </section>
  </main>
  <footer class="bottomnote">JUST FOR FUN · JUST BETWEEN US</footer>
</div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="放大的題目卡片" hidden>
  <img id="largeCard" alt="放大的題目卡片">
  <button type="button" id="closeDialog">CLOSE ✕</button>
</div>
<script src="./app.js" defer></script>
<noscript>請啟用 JavaScript 才能使用隨機抽題 App。</noscript>
</body>
</html>
